<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aesthetic Quote Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Inter&display=swap" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center text-center min-vh-100">

  <div class="container">
    <div class="quote-box p-5 rounded shadow">
      <h1 class="mb-4">✨ A Qoute For You✨</h1>
      <p id="quoteText" class="fs-4 fst-italic">Click below for some words of magic...</p>
      <button class="btn btn-outline-light mt-4" onclick="generateQuote()">New Quote</button>
      <button class="btn btn-outline-secondary mt-2" onclick="copyQuote()">Copy</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
